[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adagralora"
version = "0.1.0"
description = "Layer-wise adaptive block allocation for GraLoRA"
readme = "README.md"
# peft==0.20.0 (and every other dependency below) declares Requires-Python >=3.10.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    # Pinned exactly: the mixed-k patcher re-invokes GraloraLayer.update_layer
    # per layer and depends on that method's internal signature.
    "peft==0.20.0",
    "torch>=2.1",
    "transformers>=4.45",
    "datasets>=2.14",
    "accelerate>=0.30",
    "trl>=0.12",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
