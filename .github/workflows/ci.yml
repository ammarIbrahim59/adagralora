name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner from pulling ~2.5 GB of CUDA wheels.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Environment check
        # Asserts the pinned peft still exposes the update_layer signature the
        # mixed-k patcher calls, and that GraLoRA still has no bnb backend.
        run: python environment_check.py

      - name: Tests
        # CPU only, no model downloads, no network.
        run: pytest -q
